<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Retirada de veículo - PR2</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0b5cad">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <header class="topo">
        <h1>Retirada</h1>
        <div class="usuario"><a href="index.html">Voltar</a></div>
    </header>

    <main>
        <h2 id="placa"></h2>
        <p id="erro" class="erro" hidden></p>

        <form id="formulario">
            <label>Km atual do painel
                <input type="number" id="km" min="0" inputmode="numeric" required>
            </label>

            <label>Nível de combustível
                <select id="combustivel" required>
                    <option value="">Selecione</option>
                    <option>Reserva</option>
                    <option>1/4</option>
                    <option>1/2</option>
                    <option>3/4</option>
                    <option>Cheio</option>
                </select>
            </label>

            <label>Destino
                <input type="text" id="destino" maxlength="120" required>
            </label>

            <label>Data prevista de devolução
                <input type="date" id="devolucao" required>
            </label>

            <label>Avarias ou observações (opcional)
                <textarea id="observacoes" rows="3" maxlength="500"></textarea>
            </label>

            <h3>Fotos <span id="contador">0/6</span></h3>
            <p class="mensagem">Fotografe agora, com a câmera. Não é possível anexar fotos da galeria.</p>
            <div id="fotos" class="fotos"></div>

            <h3>Assinatura do responsável</h3>
            <canvas id="assinatura" class="assinatura" width="600" height="220"></canvas>
            <button type="button" id="limpar-assinatura" class="botao secundario">Limpar assinatura</button>

            <button type="submit" id="enviar" class="botao grande" disabled>Confirmar retirada</button>
        </form>
        <section id="sucesso" class="sucesso" hidden>
            <h2>Retirada registrada</h2>
            <p id="sucesso-detalhe"></p>
            <a href="index.html" class="botao">Voltar para a lista</a>
        </section>
    </main>

    <div id="camera" class="camera" hidden>
        <p id="camera-titulo"></p>
        <video id="camera-video" autoplay playsinline muted></video>
        <div class="camera-acoes">
            <button type="button" id="camera-cancelar" class="botao secundario">Cancelar</button>
            <button type="button" id="camera-capturar" class="botao">Capturar</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/assinatura.js"></script>
    <script src="js/retirada.js"></script>
</body>

</html>
